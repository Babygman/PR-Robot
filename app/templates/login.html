{% extends "base.html" %}
{% block title %}Login — PR-Robot{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<div class="card" style="max-width: 380px; margin: 60px auto;">
  <h1>PR-Robot</h1>
  <p class="muted">เข้าสู่ระบบเพื่อจัดการใบขอซื้อ</p>
  <form id="login-form">
    <div class="field">
      <label for="email">อีเมล</label>
      <input type="email" id="email" required autocomplete="username">
    </div>
    <div class="field">
      <label for="password">รหัสผ่าน</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <div class="error hidden" id="login-error"></div>
    <button type="submit" style="width: 100%;">เข้าสู่ระบบ</button>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById("login-error");
  errorEl.classList.add("hidden");
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const res = await fetch("/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  if (res.ok) {
    const params = new URLSearchParams(window.location.search);
    window.location.href = params.get("next") || "/app/";
    return;
  }
  const body = await res.json().catch(() => ({}));
  errorEl.textContent = body.detail || "เข้าสู่ระบบไม่สำเร็จ";
  errorEl.classList.remove("hidden");
});
</script>
{% endblock %}
