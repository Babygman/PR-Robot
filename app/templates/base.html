<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PR-Robot{% endblock %}</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% block nav %}
<aside class="sidebar">
  <div class="sidebar-brand">
    <span class="brand-seal">PR</span>
    <div>
      <div class="brand-word">PR-Robot</div>
      <div class="brand-sub">Sunstar Chemical</div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <a href="/app/" class="nav-item" data-nav-path="/app/">
      <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="6" height="6" rx="1.5" stroke="currentColor" fill="none"/><rect x="8.5" y="1.5" width="6" height="6" rx="1.5" stroke="currentColor" fill="none"/><rect x="1.5" y="8.5" width="6" height="6" rx="1.5" stroke="currentColor" fill="none"/><rect x="8.5" y="8.5" width="6" height="6" rx="1.5" stroke="currentColor" fill="none"/></svg>
      รายการ PR
    </a>
    <a href="/app/prs/new" class="nav-item" data-nav-path="/app/prs/new">
      <svg width="16" height="16" viewBox="0 0 16 16"><line x1="8" y1="3" x2="8" y2="13" stroke="currentColor" stroke-width="1.6"/><line x1="3" y1="8" x2="13" y2="8" stroke="currentColor" stroke-width="1.6"/></svg>
      สร้าง PR ใหม่
    </a>
    <a href="/app/documents/upload" class="nav-item" data-nav-path="/app/documents/upload">
      <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 11V3M8 3L4.5 6.5M8 3l3.5 3.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 12.5v1a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-1" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      อัปโหลดเอกสาร
    </a>
    <a href="/app/ars" class="nav-item" data-nav-path="/app/ars">
      <svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2h6l3 3v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/><path d="M10 2v3h3" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/><path d="m5.7 10.3 1.4 1.4 3.2-3.2" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Approval Request
    </a>
    <a href="/app/ai-usage" class="nav-item" data-nav-path="/app/ai-usage">
      <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="8" y="10.8" font-size="7.5" text-anchor="middle" fill="currentColor" font-family="IBM Plex Mono, monospace">฿</text></svg>
      ค่าใช้จ่าย AI
    </a>
    <a href="/app/budget" class="nav-item hidden" id="nav-budget" data-nav-path="/app/budget">
      <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.2" stroke="currentColor" stroke-width="1.4" fill="none"/><line x1="1.5" y1="6" x2="14.5" y2="6" stroke="currentColor" stroke-width="1.4"/></svg>
      Budget Control
    </a>
    <a href="/app/budget-levels" class="nav-item hidden" id="nav-budget-levels" data-nav-path="/app/budget-levels">
      <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 13V8M6.3 13V5M10.7 13V9M15 13V3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      Level อนุมัติ
    </a>
    <a href="/app/users" class="nav-item hidden" id="nav-users" data-nav-path="/app/users">
      <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="5.3" r="2.6" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M2.7 13.3c0-2.6 2.4-4.3 5.3-4.3s5.3 1.7 5.3 4.3" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
      จัดการ User
    </a>
  </nav>
  <div class="sidebar-spacer"></div>
  <div class="sidebar-user">
    <span class="user-avatar" id="nav-user-avatar"></span>
    <span class="user-name" id="nav-user-name"></span>
    <a href="#" id="logout-link" title="ออกจากระบบ">
      <svg width="15" height="15" viewBox="0 0 16 16"><path d="M6 2H3.5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1H6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M10 5.3 13 8l-3 2.7M13 8H6.3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</aside>
{% endblock %}
<div class="content-area">
<div class="container">
{% block content %}{% endblock %}
</div>
</div>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
