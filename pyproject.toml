[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends(...) as a default arg is FastAPI's official, intended pattern — not a bug
# UP017: keep timezone.utc (not datetime.UTC) — portable across Python 3.10/3.11/3.12
ignore = ["B008", "UP017"]

[tool.ruff.lint.per-file-ignores]
# env.py ต้อง sys.path.append() ก่อน import app.* โดยเจตนา จึงจัดกลุ่ม import แบบ isort ปกติไม่ได้
"alembic/env.py" = ["I001"]
